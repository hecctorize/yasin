<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />

    <title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .btn-group-custom {
            margin-top: 15px;
            width: 100%; 
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>

<body>
    <img id="RandomResim" src="1.jpg" style="height: 200px; width:200px; border-radius: 50%; position: relative; left:40px; top: 25px" />
    <script>
        function randomColor() {
            return "#" + Math.floor(Math.random() * 16777215).toString(16);
        }

        document.body.style.backgroundColor = randomColor();
    </script>

    <script>
        function RandomResim() {
            return Math.floor(Math.random() * 10) + 1;
        }

        const sayi = RandomResim();
        document.getElementById("RandomResim").src = `${sayi}.jpg`;


    </script>
    <script>
        function hideImage(imageId) {
            document.getElementById(imageId).style.display = "none";
        }

        function showImage(imageId) {
            document.getElementById(imageId).style.display = "block";
        }
        
    </script>
    <div class="container mt-4">
        <div class="row">

            <div class="col-xs-12 col-sm-4 col-md-3 col-lg-4">
                <div class="card-body">
                    <img id="1" src="1.jpg" style="width:100%; height:300px; border-radius: 20px" />
                    <div class="btn-group-custom">
                        <button class="btn btn-primary" onclick="showImage('1')">Göster</button>
                        <button class="btn btn-primary" onclick="hideImage('1',)">Gizle</button>
                        </div>
                    </div>
                </div>

            <div class="col-xs-12 col-sm-4 col-md-3 col-lg-4">
                <div class="card-body">
                    <img id="2" src="2.jpg" style="width: 100%; height: 300px; border-radius: 20px" />
                    <div class="btn-group-custom">
                        <button class="btn btn-primary" onclick="showImage('2')">Göster</button>
                        <button class="btn btn-primary" onclick="hideImage('2')">Gizle</button>
                    </div>
                </div>
            </div>

            <div class="col-xs-12 col-sm-4 col-md-3 col-lg-4">
                <div class="card-body">
                    <img id="3" src="3.jpg" style="width: 100%; height: 300px; border-radius: 20px" />
                    <div class="btn-group-custom">
                        <button class="btn btn-primary" onclick="showImage('3')">Göster</button>
                        <button class="btn btn-primary" onclick="hideImage('3')">Gizle</button>
                    </div>
                </div>
            </div>

        </div>
    </div>




</body>

</html>
